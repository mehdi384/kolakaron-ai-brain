async function syncGuest(){const d=readJson(GUEST_KEY,defaultData());if(!d.tasks.length){showToast('داده‌ای در حالت مهمان نیست.');return}if(state.mode==='cloud'){await putTasks(d.tasks.map(normalizeTask));for(const c of d.categories)await putCategory(c)}else{state.tasks.push(...d.tasks.map(normalizeTask));state.categories=[...state.categories,...d.categories.filter(c=>!state.categories.some(x=>x.id===c.id))];saveLocalData();renderAll()}localStorage.removeItem(GUEST_KEY);showToast('اطلاعات مهمان منتقل شد.')}
